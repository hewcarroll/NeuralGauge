[package]
name = "neuralgauge"
version = "1.0.0"
description = "Native hardware benchmark for AI workloads"
authors = []
edition = "2024"

[lib]
name = "neuralgauge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
wgpu = "24"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Optimize the benchmark crate even in dev builds. `tauri dev` uses the debug
# (unoptimized) profile, where the matmul / latency hot paths run ~100x too
# slow and produce meaningless numbers. Optimizing only our own package keeps
# dev compile fast (deps stay unoptimized) while making the measured code
# representative.
[profile.dev.package.neuralgauge]
opt-level = 3
