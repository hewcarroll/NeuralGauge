[package]
name = "ch-pib"
version = "1.0.0"
description = "Native hardware benchmark for AI workloads"
authors = []
edition = "2024"

[lib]
name = "ch_pib_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# The benchmark engine — CPU/GPU/RAM/VRAM/NPU measurement + system detection —
# lives in this crate. CH-PIB is the Tauri UI + opt-in scoring shell on top
# of it (see src/lib.rs). Engine deps (wgpu, sysinfo, rayon, bytemuck, pollster)
# now come transitively from rust-hwbench instead of being duplicated here.
rust-hwbench = { path = "../../rust-hwbench" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Optimize the benchmark engine even in dev builds. `tauri dev` uses the debug
# (unoptimized) profile, where the matmul / latency hot paths run ~100x too
# slow and produce meaningless numbers. Those hot paths now live in rust-hwbench,
# so optimize that package specifically (other deps stay unoptimized, keeping dev
# compile fast) to keep the measured code representative.
[profile.dev.package.rust-hwbench]
opt-level = 3
