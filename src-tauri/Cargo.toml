[package]
name = "neuralgauge"
version = "1.0.0"
description = "Native hardware benchmark for AI workloads"
authors = []
edition = "2024"

[lib]
name = "neuralgauge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
wgpu = "24"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
